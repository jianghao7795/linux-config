# set -g default-terminal "sicreen-256color"
set -g status-bg colour235
set -g mouse on
set -g prefix C-a
set -g default-terminal "tmux-256color"
unbind C-b
bind C-a send-prefix
set -g escape-time 20
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"
tmux_conf_copy_to_os_clipboard=true
bind '%' split-window -h -c "#{pane_current_path}"  # 垂直分屏（左右分割）
bind '"' split-window -v -c "#{pane_current_path}"  # 水平分屏（上下分割）
set -g status-interval 60
set -g status-left "#[fg=white]"
set -g status-right "#[bold,bg=colour235,fg=white] #[fg=green]#S #[fg=cyan]%H:%M #[fg=green]%Y-%m-%d #[fg=yellow]#H"
set -g status-style "bg=white,fg=white,bold"
set -g status-left-style "bg=black,fg=white"
set -g status-right-length 100
# 设置窗口状态格式（带颜色）
set -g window-status-current-format "#[fg=white,bold]#I:#{b:pane_current_path}#[default]"
set -g window-status-format "#[fg=colour8]#I:#{b:pane_current_path}#[default]"
